<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="theme-color" content="#1a181b" />
    <title>%WEB_TITLE%</title>
    <style id="expo-reset">
      html,
      body {
        height: 100%;
        margin: 0;
        background: #1a181b;
        overscroll-behavior: none;
        -webkit-text-size-adjust: 100%;
        -webkit-tap-highlight-color: transparent;
      }
      #root {
        display: flex;
        height: 100dvh;
      }
      [role='button'],
      button {
        touch-action: manipulation;
        cursor: pointer;
      }
      input,
      textarea {
        outline: none;
        font-size: 16px;
      }
      [data-hover] {
        cursor: pointer;
      }
      /* Hover only with a real mouse, so taps never leave a stuck hover state. */
      @media (hover: hover) and (pointer: fine) {
        [data-hover] {
          transition: opacity 150ms ease-out, background-color 150ms ease-out;
        }
        [data-hover='soft']:hover {
          opacity: 0.7;
        }
        [data-hover='pill']:hover {
          background-color: rgba(255, 255, 255, 0.06);
        }
        [data-hover='day']:not([aria-selected='true']):hover > :first-child {
          background-color: rgba(255, 255, 255, 0.08);
        }
      }
    </style>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
  </body>
</html>
